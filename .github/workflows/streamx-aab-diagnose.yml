name: StreamX AAB diagnose

# Temporary diagnostic workflow: reruns only bundleRelease through a script so
# the job log stays short and the Gradle failure block is visible at its end.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REACT_NATIVE_ARCHITECTURES: arm64-v8a

jobs:
  build:
    name: Release AAB only
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-diagnose-${{ runner.os }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Diagnose release bundle
        run: bash scripts/ci-diagnose-aab.sh
